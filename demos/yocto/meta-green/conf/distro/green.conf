require conf/distro/poky.conf

DISTRO = "green"
DISTRO_NAME = "Green embedded Linux (EECONE reference)"
DISTRO_VERSION = "1.0"
SDK_VENDOR = "-greensdk"
MAINTAINER = "Lenka Koskova Triskova <lenka.koskova.triskova@tul.cz>"

INIT_MANAGER = "systemd"

DISTRO_FEATURES:remove = "3g nfc x11 wayland vulkan opengl pulseaudio bluetooth wifi zeroconf pci alsa pcmcia usbgadget"

INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"

INHERIT += "image-buildinfo"

BB_GENERATE_MIRROR_TARBALLS = "1"

require conf/distro/include/green-power.inc
