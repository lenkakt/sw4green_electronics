apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: greenhouse
      defaultBucket: greenhouse
    secureJsonData:
      token: $__env{INFLUXDB_TOKEN}
